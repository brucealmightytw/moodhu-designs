<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moodhu Designs 目錄</title>
<style>
  :root {
    --bg: #0a0e17; --surface: #111827; --card: #1e293b;
    --accent: #38bdf8; --accent2: #0ea5e9; --text: #f1f5f9;
    --text2: #94a3b8; --gold: #fbbf24; --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }

  .hero {
    background: linear-gradient(135deg, #0c1929 0%, #1a2d4a 50%, #0f172a 100%);
    padding: 48px 20px 32px; text-align: center;
    border-bottom: 2px solid var(--accent);
    position: relative; overflow: hidden;
  }
  .hero::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 30% 50%, rgba(56,189,248,.08) 0%, transparent 70%);
  }
  .hero h1 {
    font-size: 2.2rem; letter-spacing: 2px; position: relative;
    background: linear-gradient(135deg, var(--accent), #818cf8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero p { color: var(--text2); margin-top: 8px; position: relative; }
  .stats {
    display: flex; justify-content: center; gap: 32px; margin-top: 16px;
    font-size: .85rem; color: var(--text2); flex-wrap: wrap; position: relative;
  }
  .stats span { background: var(--surface); padding: 6px 16px; border-radius: 20px; border: 1px solid #1e3a5f; }
  .stats strong { color: var(--accent); }

  .toolbar {
    background: var(--surface); border-bottom: 1px solid #1e293b;
    position: sticky; top: 0; z-index: 100;
  }
  .cat-bar {
    display: flex; gap: 6px; padding: 10px 16px; overflow-x: auto;
    scrollbar-width: thin; flex-wrap: wrap;
  }
  .cat-btn {
    padding: 6px 14px; border-radius: 20px; border: 1px solid #334155;
    background: transparent; color: var(--text2); cursor: pointer;
    font-size: .78rem; transition: all .2s; white-space: nowrap;
    flex-shrink: 0;
  }
  .cat-btn:hover { border-color: var(--accent2); color: var(--text); }
  .cat-btn.active { background: var(--accent2); color: #fff; border-color: var(--accent2); }
  .cat-btn.all { border-color: var(--accent); }
  .cat-btn.all.active { background: var(--accent); border-color: var(--accent); }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px; padding: 16px; max-width: 1600px; margin: 0 auto;
  }

  .card {
    background: var(--card); border-radius: var(--radius); overflow: hidden;
    transition: transform .2s, box-shadow .2s;
    border: 1px solid #1e293b;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,.4); border-color: var(--accent2); }

  .card-img-wrap {
    width: 100%; aspect-ratio: 9 / 16; background: #0f172a; overflow: hidden;
    position: relative;
  }
  .card-img-wrap img {
    width: 100%; height: 100%; object-fit: cover;
    transition: opacity .4s;
  }
  .card-img-wrap img.loading { opacity: 0; }
  .card-img-wrap img.loaded { opacity: 1; }
  .card-img-wrap .placeholder {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--text2); font-size: .7rem; opacity: .4;
  }

  .card-body { padding: 10px 12px 12px; }
  .card-title {
    font-size: .82rem; font-weight: 600; margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-theme {
    font-size: .68rem; color: var(--accent); margin-bottom: 6px;
  }
  .card-meta {
    display: flex; justify-content: space-between; align-items: center;
  }
  .card-style {
    font-size: .65rem; color: var(--gold); opacity: .9;
  }
  .card-size {
    font-size: .6rem; color: var(--text2);
  }

  .empty-msg {
    grid-column: 1 / -1; text-align: center; padding: 60px 20px;
    color: var(--text2); font-size: .95rem;
  }

  .footer {
    text-align: center; padding: 24px; color: var(--text2); font-size: .75rem;
    border-top: 1px solid #1e293b; margin-top: 32px;
  }
  .footer a { color: var(--accent); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }

  @media (max-width: 768px) {
    .gallery { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
    .hero h1 { font-size: 1.5rem; }
    .stats { gap: 12px; font-size: .75rem; }
  }
  @media (max-width: 480px) {
    .gallery { grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 8px; }
    .card-body { padding: 6px 8px 8px; }
    .card-title { font-size: .7rem; }
    .card-theme { font-size: .6rem; }
    .card-style { font-size: .58rem; }
    .card-size { font-size: .55rem; }
  }
</style>
</head>

const THEME_EMOJIS = {
  "Clownfish": "🐠", "Dolphin": "🐬", "HammerheadShark": "🦈",
  "MandalaMantaWhaleShark": "🐋", "MantaRay": "🦑",
  "MantaWhaleShark": "🐋", "Mixed": "🎨", "NapoleonWrasse": "🐟",
  "ReefShark": "🦈", "SeaTurtle": "🐢", "TigerShark": "🦈",
  "TropicalFish": "🐠", "WhaleShark": "🦈", "_unsorted": "📦"
};
const STYLE_EMOJIS = {
  "AfremovOil": "🎨", "AfremovPaletteKnife": "🔪", "MondrianGeometric": "▣",
  "VanGoghStarryNight": "⭐", "KlimtArtNouveau": "✨", "Watercolor": "💧",
  "Warhol": "🎭", "WarholPopArt": "🎭", "ArtDeco": "🔷", "Geometric": "◈",
  "Mandala": "🕉", "ThaanaCalligraphy": "✍", "Ukiyoe": "🌊",
  "InkWash": "🖌", "StainedGlass": "🔮", "OilPainting": "🖼",
  "RealisticOil": "🖼", "ImpastoOil": "🎨", "ExpressionistOil": "🎨",
  "SeamlessPattern": "♾", "Standard": "📐", "Illustration": "✏️",
  "MinimalistLine": "─", "HokusaiUkiyoe": "🌊"
};

let activeCat = 'all';

function stats() {
  const themes = [...new Set(DESIGNS.map(d => d.theme))];
  const styles = [...new Set(DESIGNS.map(d => d.styleCode))];
  return { total: DESIGNS.length, themes: themes.length, styles: styles.length };
}

function renderStats() {
  const s = stats();
  document.getElementById('stats').innerHTML =
    `<span>📐 <strong>${s.total}</strong> 件設計</span>` +
    `<span>📂 <strong>${s.themes}</strong> 個主題</span>` +
    `<span>🎨 <strong>${s.styles}</strong> 種風格</span>`;
}

function renderCats() {
  const themes = [...new Set(DESIGNS.map(d => d.theme))];
  let html = `<button class="cat-btn all active" data-cat="all">🔄 全部 (${DESIGNS.length})</button>`;
  for (const t of themes) {
    const cnt = DESIGNS.filter(d => d.theme === t).length;
    const emoji = THEME_EMOJIS[t] || '📁';
    const label = DESIGNS.find(d => d.theme === t)?.themeLabel || t;
    html += `<button class="cat-btn" data-cat="${t}">${emoji} ${label} (${cnt})</button>`;
  }
  document.getElementById('catBar').innerHTML = html;

  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCat = btn.dataset.cat;
      renderGallery();
    });
  });
}

function renderGallery() {
  const filtered = activeCat === 'all' ? DESIGNS : DESIGNS.filter(d => d.theme === activeCat);
  const container = document.getElementById('gallery');

  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-msg">😕 沒有符合條件的設計</div>';
    return;
  }

  let html = '';
  for (const d of filtered) {
    const emoji = THEME_EMOJIS[d.theme] || '📁';
    const styleEmoji = STYLE_EMOJIS[d.styleCode] || '🎨';
    const sizeDisplay = d.sizeKb > 1024 ? `${(d.sizeKb/1024).toFixed(1)} MB` : `${d.sizeKb} KB`;

    html += `<div class="card">
      <div class="card-img-wrap">
        <div class="placeholder">載入中...</div>
        <img class="loading" src="../${d.path}" alt="${d.file}" onload="this.classList.remove('loading');this.classList.add('loaded');this.previousElementSibling.style.display='none'" onerror="this.parentElement.innerHTML='<div class=placeholder style=display:flex>❌ 載入失敗</div>'">
      </div>
      <div class="card-body">
        <div class="card-title">${d.file.replace('.png','')}</div>
        <div class="card-theme">${emoji} ${d.themeLabel}</div>
        <div class="card-meta">
          <span class="card-style">${styleEmoji} ${d.styleLabel}</span>
          <span class="card-size">${sizeDisplay}</span>
        </div>
      </div>
    </div>`;
  }
  container.innerHTML = html;
}

renderStats();
renderCats();
renderGallery();
</script>
