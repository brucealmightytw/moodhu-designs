<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moodhu Designs — Ocean Art Gallery</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0a; --surface:#1a1a1a; --surface2:#222;
  --text:#f5f5f7; --text2:#86868b; --text3:#555;
  --gold:#d4af37; --gold-dim:#a8882e;
  --radius:16px; --gap:20px;
}
html{-webkit-font-smoothing:antialiased}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh;
}

/* ═══ Header ═══ */
header{
  position:sticky; top:0; z-index:100;
  background:rgba(10,10,10,0.85); backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.header-inner{
  max-width:1280px; margin:0 auto; padding:12px 24px;
  display:flex; align-items:center; gap:14px;
}
.logo{height:32px;width:auto;opacity:.9}
.header-title{font-size:18px;font-weight:600;letter-spacing:-.02em;color:var(--text)}
.header-right{margin-left:auto;font-size:13px;color:var(--text2)}

/* ═══ Hero ═══ */
.hero{
  max-width:1280px; margin:0 auto; padding:80px 24px 40px;
}
.hero h1{
  font-size:56px; font-weight:700; letter-spacing:-.025em; line-height:1.08;
  background:linear-gradient(135deg,#f5f5f7 30%,var(--gold));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
}
.hero p{font-size:20px;color:var(--text2);margin-top:12px;font-weight:400}
.hero-stats{display:flex;gap:32px;margin-top:24px;font-size:14px;color:var(--text3)}
.hero-stats span{color:var(--text2)}

/* ═══ Toolbar ═══ */
.toolbar{
  max-width:1280px; margin:0 auto; padding:0 24px 20px;
  display:flex; align-items:center; justify-content:space-between; gap:16px;
}
.cat-scroll{overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;flex:1}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-list{display:flex;gap:8px;white-space:nowrap;padding:2px 0}
.cat-item{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 18px;border-radius:100px;
  background:var(--surface);color:var(--text2);
  font-size:13px;font-weight:500;cursor:pointer;
  transition:all .25s;border:1px solid transparent;
  user-select:none;
}
.cat-item:hover{background:var(--surface2);color:var(--text)}
.cat-item.active{
  background:var(--gold);color:#0a0a0a;font-weight:600;
}
.sort-group{display:flex;align-items:center;gap:8px}
.sort-group label{font-size:13px;color:var(--text3);font-weight:500}
.sort-select{
  background:var(--surface);color:var(--text);border:1px solid rgba(255,255,255,.1);
  border-radius:8px;padding:8px 14px;font-size:13px;
  font-family:inherit;cursor:pointer;outline:none;
  -webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='%2386868b'%3E%3Cpath d='M1 1l4 4 4-4'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;padding-right:30px;
}
.sort-select:focus{border-color:var(--gold)}

/* ═══ Gallery Grid ═══ */
.gallery{
  max-width:1280px; margin:0 auto; padding:0 24px 60px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:var(--gap);
}
.card{
  background:var(--surface);border-radius:var(--radius);overflow:hidden;
  cursor:pointer;transition:transform .35s cubic-bezier(.32,.72,0,1),box-shadow .35s;
  position:relative;border:1px solid rgba(255,255,255,.04);
}
.card:hover{
  transform:translateY(-6px);
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.card-img-wrap{
  position:relative;width:100%;padding-top:177.78%;overflow:hidden;
  background:#111;
}
.card-img{
  position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;
  transition:transform .45s cubic-bezier(.32,.72,0,1);
}
.card:hover .card-img{transform:scale(1.05)}
.card-rank{
  position:absolute;top:10px;left:10px;z-index:2;
  padding:5px 12px;border-radius:100px;
  font-size:11px;font-weight:700;letter-spacing:.03em;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.card-rank.r1{background:rgba(212,175,55,.85);color:#0a0a0a}
.card-rank.r2{background:rgba(192,192,192,.75);color:#0a0a0a}
.card-rank.r3{background:rgba(205,127,50,.75);color:#fff}
.card-rank.r4{background:rgba(232,97,110,.7);color:#fff}
.card-rank.r5{background:rgba(58,123,213,.7);color:#fff}
.card-body{padding:12px 14px 14px}
.card-cat{
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;
  color:var(--gold-dim);margin-bottom:4px;
}
.card-title{
  font-size:13px;font-weight:500;line-height:1.3;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  min-height:2.6em;
}
.card-actions{display:flex;gap:6px;margin-top:10px;align-items:center}
.vote-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:4px;
  padding:6px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.08);
  background:transparent;color:var(--text2);font-size:12px;cursor:pointer;
  transition:all .2s;font-family:inherit;min-height:32px;
}
.vote-btn:hover{background:rgba(255,255,255,.06);color:var(--text)}
.vote-btn.active-like{background:rgba(212,175,55,.15);border-color:var(--gold);color:var(--gold)}
.vote-btn.active-dislike{background:rgba(255,69,58,.12);border-color:#ff453a;color:#ff453a}
.del-btn{
  width:32px;height:32px;border-radius:8px;border:1px solid rgba(255,255,255,.08);
  background:transparent;color:var(--text3);font-size:14px;cursor:pointer;
  transition:all .2s;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.del-btn:hover{background:rgba(255,69,58,.15);border-color:#ff453a;color:#ff453a}

/* Top 5 card accents */
.card.top1{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 8px 30px rgba(212,175,55,.1)}
.card.top1:hover{box-shadow:0 0 0 1px var(--gold),0 20px 60px rgba(212,175,55,.15)}
.card.top2{border-color:rgba(192,192,192,.4)}
.card.top3{border-color:rgba(205,127,50,.35)}
.card.top4{border-color:rgba(232,97,110,.25)}
.card.top5{border-color:rgba(58,123,213,.25)}

/* ═══ Modal ═══ */
.modal{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  align-items:center;justify-content:center;
}
.modal.show{display:flex}
.modal-content{
  background:var(--surface);border-radius:20px;padding:32px;max-width:400px;width:90%;
  border:1px solid rgba(255,255,255,.06);
}
.modal-content h3{font-size:20px;font-weight:600;margin-bottom:20px;color:var(--text)}
.modal-content input{
  width:100%;padding:12px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.1);
  background:var(--bg);color:var(--text);font-size:16px;font-family:inherit;
  outline:none;transition:border-color .2s;
}
.modal-content input:focus{border-color:var(--gold)}
.error-text{display:none;color:#ff453a;font-size:13px;margin-top:8px}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions button{
  flex:1;padding:12px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;
  font-family:inherit;border:none;transition:all .2s;
}
.btn-cancel{background:var(--surface2);color:var(--text2)}
.btn-cancel:hover{background:var(--surface2);color:var(--text)}
.btn-confirm{background:var(--gold);color:#0a0a0a}
.btn-confirm:hover{opacity:.9}

/* ═══ Lightbox ═══ */
.lightbox{
  display:none;position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  align-items:center;justify-content:center;
}
.lightbox.show{display:flex}
.lightbox-inner{max-width:90vw;max-height:90vh;display:flex;flex-direction:column;align-items:center}
.lightbox-inner img{max-width:100%;max-height:75vh;border-radius:12px;object-fit:contain}
.lightbox-info{text-align:center;margin-top:16px}
.lightbox-info h3{font-size:20px;font-weight:600;color:var(--text)}
.lightbox-info p{font-size:14px;color:var(--text2);margin-top:4px}
.lightbox-close{
  position:fixed;top:24px;right:24px;width:44px;height:44px;
  border-radius:50%;border:none;background:rgba(255,255,255,.1);color:#fff;
  font-size:22px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;
}
.lightbox-close:hover{background:rgba(255,255,255,.2);transform:scale(1.1)}

/* ═══ Toast ═══ */
.toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
  padding:12px 24px;border-radius:100px;
  background:rgba(30,30,30,.9);backdrop-filter:blur(12px);
  color:var(--text);font-size:14px;font-weight:500;
  opacity:0;transition:opacity .3s;pointer-events:none;z-index:400;
  border:1px solid rgba(255,255,255,.08);
}
.toast.show{opacity:1}
.toast.error{background:rgba(255,69,58,.2);border-color:#ff453a;color:#ff453a}

/* ═══ Responsive ═══ */
@media(max-width:1024px){.gallery{grid-template-columns:repeat(4,1fr)}}
@media(max-width:768px){
  .hero h1{font-size:36px}
  .hero{padding:48px 20px 24px}
  .gallery{grid-template-columns:repeat(3,1fr);gap:14px;padding:0 16px 40px}
  .header-inner{padding:10px 16px}
  .toolbar{padding:0 16px 16px;flex-direction:column;align-items:stretch}
  .cat-scroll{order:2}
  .sort-group{order:1}
}
@media(max-width:480px){.gallery{grid-template-columns:repeat(2,1fr)}}

/* ═══ Loading placeholder ═══ */
.card-img-wrap.loading::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent 30%,rgba(255,255,255,.03) 50%,transparent 70%);
  background-size:200% 100%;animation:shimmer 1.5s infinite;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <img src="logo.png" alt="Moodhu" class="logo" onerror="this.style.display='none'">
    <div class="header-title">Moodhu Designs</div>
    <div class="header-right" id="headerStats"></div>
  </div>
</header>

<div class="hero">
  <h1>Ocean Art<br>Collection</h1>
  <p>Inspired by the beauty of the Maldives</p>
  <div class="hero-stats">
    <span id="totalWorks">—</span> works
  </div>
</div>

<div class="toolbar">
  <div class="cat-scroll"><div class="cat-list" id="catList"></div></div>
  <div class="sort-group">
    <label>Sort</label>
    <select class="sort-select" id="sortSelect">
      <option value="score">Top Rated</option>
      <option value="likes">Most Liked</option>
      <option value="votes">Most Votes</option>
      <option value="newest">Newest</option>
    </select>
  </div>
</div>

<div class="gallery" id="gallery"></div>

<!-- Admin Modal -->
<div class="modal" id="adminModal">
  <div class="modal-content">
    <h3>Admin Verification</h3>
    <input type="password" id="pwdInput" placeholder="Enter password">
    <div class="error-text" id="pwdError">Incorrect password</div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-confirm" id="pwdConfirm">Delete</button>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="if(event.target===this)closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <div class="lightbox-inner">
    <img id="lbImg" src="" alt="">
    <div class="lightbox-info">
      <h3 id="lbTitle"></h3>
      <p id="lbCat"></p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = (() => {
  const loc = window.location;
  if (loc.hostname === 'localhost' || loc.hostname === '127.0.0.1')
    return `http://${loc.hostname}:8000`;
  return loc.origin;
})();
const ADMIN_PASSWORD = 'moodhu2024';
const THUMB = true; // use thumbnails in gallery

let designs = [];
let votes = {};
let currentCat = 'all';
let currentSort = 'score';
let deleteTarget = null;

function getVoterId() {
  let vid = localStorage.getItem('moodhu_voter_id');
  if (!vid) {
    const fp = [navigator.userAgent, screen.width, screen.height, navigator.language, new Date().getTimezoneOffset()].join('||');
    let hash = 0;
    for (let i = 0; i < fp.length; i++) { hash = ((hash << 5) - hash) + fp.charCodeAt(i); hash |= 0; }
    vid = 'v_' + Math.abs(hash).toString(36) + '_' + Date.now().toString(36);
    localStorage.setItem('moodhu_voter_id', vid);
  }
  return vid;
}
const VOTER_ID = getVoterId();

async function init() {
  try {
    const designData = await fetch(`${API_BASE}/api/designs`).then(r => r.json());
    designs = designData.designs || [];
    
    try {
      const voteCounts = await fetch(`${API_BASE}/api/votes`).then(r => r.json());
      designs.forEach(d => {
        d.votes = voteCounts[d.id] || {likes: 0, dislikes: 0};
        d.votes.net = d.votes.likes - d.votes.dislikes;
      });
    } catch(e) {
      console.warn('Vote counts:', e);
      designs.forEach(d => d.votes = {likes: 0, dislikes: 0, net: 0});
    }
    
    try {
      votes = await fetch(`${API_BASE}/api/votes/me?voter_id=${VOTER_ID}`).then(r => r.json());
    } catch(e) {
      console.warn('User votes:', e);
      votes = {};
    }
    
    document.getElementById('totalWorks').textContent = designs.length;
    renderCategories();
    renderGallery();
  } catch(e) {
    console.error('Init:', e);
    showToast('Failed to load gallery');
  }
}

function renderCategories() {
  const cats = {};
  designs.forEach(d => { cats[d.category] = (cats[d.category] || 0) + 1; });
  const catArr = Object.entries(cats).sort((a,b) => b[1] - a[1]);
  
  let html = `<div class="cat-item ${currentCat === 'all' ? 'active' : ''}" onclick="filterCat('all')">All</div>`;
  catArr.forEach(([cat]) => {
    html += `<div class="cat-item ${currentCat === cat ? 'active' : ''}" onclick="filterCat('${cat.replace(/'/g,"\\'")}')">${cat}</div>`;
  });
  document.getElementById('catList').innerHTML = html;
}

function filterCat(cat) {
  currentCat = cat;
  renderCategories();
  renderGallery();
}

const SORT_FNS = {
  score: (a,b) => (b.votes?.net||0) - (a.votes?.net||0),
  likes: (a,b) => (b.votes?.likes||0) - (a.votes?.likes||0),
  votes: (a,b) => ((b.votes?.likes||0)+(b.votes?.dislikes||0)) - ((a.votes?.likes||0)+(a.votes?.dislikes||0)),
  newest: (a,b) => (b.id||'').localeCompare(a.id||'')
};

document.getElementById('sortSelect').onchange = function() {
  currentSort = this.value;
  renderGallery();
};

function renderGallery() {
  const sorted = [...designs].filter(d => currentCat === 'all' || d.category === currentCat);
  sorted.sort(SORT_FNS[currentSort] || SORT_FNS.score);
  
  const topIds = new Set(sorted.slice(0,5).map(d => d.id));
  const topMap = {};
  sorted.forEach((d,i) => { if (i<5) topMap[d.id]=i+1; });
  
  const container = document.getElementById('gallery');
  
  const html = sorted.map((d,i) => {
    const v = d.votes || {likes:0,dislikes:0};
    const myVote = votes[d.id];
    const rank = topMap[d.id] || 0;
    const rankLabel = rank === 1 ? 'NO.1' : rank === 2 ? 'NO.2' : rank === 3 ? 'NO.3' : rank === 4 ? 'NO.4' : rank === 5 ? 'NO.5' : '';
    const topClass = rank >= 1 && rank <= 5 ? ` top${rank}` : '';
    const imgSrc = THUMB ? `thumbs/${d.filename}` : `images/${d.filename}`;
    
    return `<div class="card${topClass}" onclick="openLightbox('${d.id}')">
      <div class="card-img-wrap loading">
        ${rankLabel ? `<div class="card-rank r${rank}">${rankLabel}</div>` : ''}
        <img class="card-img" src="${imgSrc}" alt="${d.title}" loading="lazy"
             onload="this.parentElement.classList.remove('loading')"
             onerror="this.parentElement.classList.remove('loading');this.style.display='none'">
      </div>
      <div class="card-body">
        <div class="card-cat">${d.category}</div>
        <div class="card-title">${d.title}</div>
        <div class="card-actions">
          <button class="vote-btn ${myVote === 'like' ? 'active-like' : ''}" onclick="event.stopPropagation();vote('${d.id}','like')">👍 ${v.likes||0}</button>
          <button class="vote-btn ${myVote === 'dislike' ? 'active-dislike' : ''}" onclick="event.stopPropagation();vote('${d.id}','dislike')">👎 ${v.dislikes||0}</button>
          <button class="del-btn" onclick="event.stopPropagation();openModal('${d.id}')">🗑</button>
        </div>
      </div>
    </div>`;
  }).join('');
  
  container.innerHTML = html || '<p style="grid-column:1/-1;text-align:center;color:#555;padding:60px 0">No works found</p>';
}

async function vote(id, type) {
  try {
    const r = await fetch(`${API_BASE}/api/vote?voter_id=${VOTER_ID}`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({design_id: id, vote_type: type})
    });
    const res = await r.json();
    if (r.ok) {
      votes[id] = res.action === 'removed' ? null : type;
      const d = designs.find(x => x.id === id);
      if (d && res.votes) d.votes = res.votes[d.id] || {likes:0,dislikes:0,net:0};
      renderGallery();
      showToast(res.action === 'removed' ? 'Vote cancelled' : 'Vote recorded!');
    }
  } catch(e) {
    showToast('Vote failed', true);
  }
}

function openModal(id) {
  deleteTarget = id;
  document.getElementById('pwdInput').value = '';
  document.getElementById('pwdError').style.display = 'none';
  document.getElementById('adminModal').classList.add('show');
  setTimeout(() => document.getElementById('pwdInput').focus(), 100);
}
function closeModal() {
  document.getElementById('adminModal').classList.remove('show');
  deleteTarget = null;
}
document.getElementById('pwdConfirm').onclick = async function() {
  const pwd = document.getElementById('pwdInput').value;
  if (pwd !== ADMIN_PASSWORD) {
    document.getElementById('pwdError').style.display = 'block';
    return;
  }
  try {
    const r = await fetch(`${API_BASE}/api/delete`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({design_id: deleteTarget, password: pwd})
    });
    const res = await r.json();
    if (r.ok && res.ok) {
      showToast('Deleted permanently');
      closeModal();
      await init();
    } else {
      showToast('Delete failed', true);
    }
  } catch(e) {
    showToast('Server error', true);
  }
};
document.getElementById('pwdInput').onkeydown = e => {
  if (e.key === 'Enter') document.getElementById('pwdConfirm').click();
};

function openLightbox(id) {
  const d = designs.find(x => x.id === id);
  if (!d) return;
  document.getElementById('lbImg').src = `images/${d.filename}`;
  document.getElementById('lbTitle').textContent = d.title;
  document.getElementById('lbCat').textContent = d.category;
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
}

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  t.classList.add('show');
  clearTimeout(t._hide);
  t._hide = setTimeout(() => t.classList.remove('show'), 2500);
}

init();
</script>
</body>
</html>
