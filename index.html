<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moodhu Designs 投票</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --page: #f1f1ef;
  --white: #ffffff;
  --primary: #6e7051;
  --gold: #c8aa4f;
  --text: #262b2c;
  --text2: #979a9b;
  --border: #e4e6e7;
  --like: #4ade80;
  --dislike: #f87171;
  --shadow: 0 1px 3px rgba(0,0,0,.06);
  --shadow-hover: 0 4px 16px rgba(0,0,0,.08);
  --radius: 0;
  --font-body: 'Karla', sans-serif;
  --font-head: 'Rubik', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 112.5%; }
body { font-family: var(--font-body); background: var(--page); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

/* Header */
header {
  background: var(--white); padding: 20px 24px 16px; text-align: center;
  border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
}
header .logo {
  font-family: var(--font-head); font-size: 1.5rem; font-weight: 700;
  letter-spacing: 1px; color: var(--text);
}
header .logo em { font-style: normal; color: var(--primary); }
header .sub { color: var(--text2); font-size: .8rem; margin-top: 2px; }
.stats-bar {
  display: flex; justify-content: center; gap: 28px; margin-top: 8px;
  font-size: .75rem; color: var(--text2); flex-wrap: wrap;
}
.stats-bar strong { color: var(--text); font-weight: 700; }

/* Toolbar */
.toolbar {
  background: var(--white); border-bottom: 1px solid var(--border);
  position: sticky; top: 103px; z-index: 99;
}
.cat-bar {
  display: flex; gap: 4px; padding: 10px 16px 6px; overflow-x: auto;
  scrollbar-width: none; justify-content: center;
}
.cat-bar::-webkit-scrollbar { display: none; }
.cat-btn {
  flex-shrink: 0; padding: 6px 18px; border: 1px solid var(--border);
  background: transparent; color: var(--text2); cursor: pointer;
  font-family: var(--font-body); font-size: .75rem;
  transition: all .2s; white-space: nowrap; letter-spacing: .3px;
}
.cat-btn:hover { border-color: var(--primary); color: var(--primary); }
.cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.cat-btn.top5 { border-color: var(--gold); color: var(--gold); }
.cat-btn.top5.active { background: var(--gold); color: #fff; border-color: var(--gold); }

.sort-bar {
  display: flex; gap: 4px; padding: 4px 16px 10px; align-items: center;
  justify-content: center;
}
.sort-bar label { color: var(--text2); font-size: .7rem; letter-spacing: .3px; }
.sort-btn {
  padding: 3px 12px; border: 1px solid var(--border);
  background: transparent; color: var(--text2); cursor: pointer;
  font-family: var(--font-body); font-size: .68rem; transition: all .2s;
}
.sort-btn:hover { border-color: var(--primary); color: var(--primary); }
.sort-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* Gallery */
.gallery {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px;
  padding: 24px; max-width: 1400px; margin: 0 auto;
}

.card {
  background: var(--white); overflow: hidden; transition: all .2s;
  border: 1px solid var(--border); cursor: pointer;
}
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.card.top1 { border-color: var(--gold); }
.card.top2 { border-color: #bbb; }
.card.top3 { border-color: #cd7f32; }
.card.top4 { border-color: var(--primary); }

.card-img-wrap {
  width: 100%; aspect-ratio: 9 / 16; background: var(--page); overflow: hidden;
}
.card-img-wrap img {
  width: 100%; height: 100%; object-fit: cover;
  transition: opacity .3s;
}
.card-img-wrap img.loading { opacity: 0; }
.card-img-wrap img.loaded { opacity: 1; }

.card-body { padding: 10px 12px 12px; cursor: default; }
.card-title {
  font-family: var(--font-head); font-size: .8rem; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--text);
}
.card-cat {
  font-size: .65rem; color: var(--primary); text-transform: uppercase;
  letter-spacing: .5px; margin-bottom: 6px;
}
.card-rank {
  display: inline-block; font-family: var(--font-head); font-size: .6rem; font-weight: 500;
  background: var(--gold); color: #fff; padding: 1px 8px;
  letter-spacing: .5px; margin-bottom: 5px;
}
.card-rank.t1 { background: var(--gold); }
.card-rank.t2 { background: #bbb; color: var(--text); }
.card-rank.t3 { background: #cd7f32; }

.vote-row {
  display: flex; align-items: center; gap: 6px;
}
.vote-btn {
  display: flex; align-items: center; gap: 3px;
  padding: 4px 12px; border: 1px solid var(--border);
  background: transparent; color: var(--text2); cursor: pointer;
  font-family: var(--font-body); font-size: .75rem;
  transition: all .2s;
}
.vote-btn:hover { border-color: var(--text); color: var(--text); }
.vote-btn.like.active { background: rgba(74,222,128,.08); border-color: var(--like); color: #166534; }
.vote-btn.dislike.active { background: rgba(248,113,113,.08); border-color: var(--dislike); color: #991b1b; }
.vote-btn .count { font-weight: 700; min-width: 14px; text-align: center; }
.vote-btn .icon { font-size: .85rem; line-height: 1; }
.vote-btn.loading { pointer-events: none; opacity: .5; }

.del-btn {
  margin-left: auto; padding: 4px 8px; border: 1px solid var(--border);
  background: transparent; color: var(--text2); cursor: pointer;
  font-size: .75rem; transition: all .2s;
}
.del-btn:hover { color: var(--dislike); border-color: var(--dislike); }

/* Lightbox */
.lightbox {
  display: none; position: fixed; inset: 0; z-index: 998;
  background: rgba(0,0,0,.88); align-items: center; justify-content: center;
  flex-direction: column;
}
.lightbox.show { display: flex; }
.lightbox-close {
  position: absolute; top: 16px; right: 20px;
  font-size: 1.8rem; color: #fff; cursor: pointer;
  background: none; border: none; z-index: 1;
  opacity: .5; transition: opacity .2s;
}
.lightbox-close:hover { opacity: 1; }
.lightbox img {
  max-width: 90vw; max-height: 78vh; object-fit: contain;
}
.lightbox-info {
  text-align: center; margin-top: 14px; color: #bbb;
  font-size: .85rem;
}
.lightbox-info .title { color: #fff; font-family: var(--font-head); font-weight: 500; }
.lightbox-info .cat { color: var(--gold); font-size: .7rem; letter-spacing: .5px; text-transform: uppercase; }
.lightbox .vote-row { margin-top: 10px; justify-content: center; }
.lightbox .vote-btn { font-size: .9rem; padding: 6px 18px; border-color: #555; color: #ccc; }
.lightbox .vote-btn:hover { border-color: #fff; color: #fff; }
.lightbox .vote-btn.like.active { background: rgba(74,222,128,.15); border-color: var(--like); color: var(--like); }
.lightbox .vote-btn.dislike.active { background: rgba(248,113,113,.15); border-color: var(--dislike); color: var(--dislike); }

/* Admin Modal */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
  z-index: 999; align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--white); padding: 28px; max-width: 360px; width: 90%;
  text-align: center; border: 1px solid var(--border);
}
.modal h3 { font-family: var(--font-head); font-size: 1rem; font-weight: 500; color: var(--text); }
.modal input {
  width: 100%; padding: 10px 14px; border: 1px solid var(--border);
  background: var(--page); color: var(--text); font-family: var(--font-body);
  font-size: .9rem; text-align: center; outline: none;
}
.modal input:focus { border-color: var(--primary); }
.modal .btn-row { display: flex; gap: 10px; margin-top: 16px; justify-content: center; }
.modal .btn-row button {
  padding: 8px 24px; border: 1px solid var(--border);
  cursor: pointer; font-family: var(--font-body); font-size: .85rem;
  transition: all .2s; background: transparent;
}
.modal .btn-confirm { background: var(--gold); color: var(--text); border-color: var(--gold); }
.modal .btn-confirm:hover { opacity: .85; }
.modal .btn-cancel { color: var(--text2); }
.modal .btn-cancel:hover { border-color: var(--text); color: var(--text); }
.modal .error { color: var(--dislike); font-size: .8rem; margin-top: 8px; display: none; }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: var(--white); padding: 10px 24px;
  font-family: var(--font-body); font-size: .8rem; z-index: 1000;
  opacity: 0; transition: opacity .25s; pointer-events: none;
  border: 1px solid transparent;
}
.toast.show { opacity: 1; }
.toast.success { border-color: var(--like); }
.toast.error { border-color: var(--dislike); }

.loading-gallery {
  display: flex; align-items: center; justify-content: center;
  min-height: 50vh; color: var(--text2); flex-direction: column; gap: 12px;
}
.spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.empty-state { text-align: center; padding: 80px 20px; color: var(--text2); }
.empty-state .big-icon { font-size: 2.5rem; margin-bottom: 10px; }

@media (max-width: 1024px) {
  .gallery { grid-template-columns: repeat(4, 1fr); gap: 14px; padding: 16px; }
}
@media (max-width: 768px) {
  .gallery { grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 12px; }
  header { padding: 16px 16px 12px; position: relative; top: 0; }
  .toolbar { position: relative; top: 0; }
  header .logo { font-size: 1.2rem; }
  .stats-bar { gap: 16px; font-size: .7rem; }
  .cat-bar { justify-content: flex-start; }
  .sort-bar { justify-content: flex-start; }
  .card-body { padding: 8px 10px 10px; }
  .vote-btn { padding: 3px 10px; font-size: .7rem; }
  .lightbox img { max-width: 95vw; max-height: 65vh; }
}
@media (max-width: 480px) {
  .gallery { grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 8px; }
}

/* Footer */
footer {
  text-align: center; padding: 24px; color: var(--text2); font-size: .7rem;
  border-top: 1px solid var(--border); margin-top: 40px;
}
</style>
</head>
<body>

<header>
  <div class="logo">🦈 <em>Moodhu</em> Designs</div>
  <div class="sub">票選你最喜歡的海洋設計作品</div>
  <div class="stats-bar">
    <span>總投票 <strong id="totalVotes">0</strong></span>
    <span>🥇 冠軍 <strong id="topDesign">-</strong></span>
    <span>投票人數 <strong id="voterCount">0</strong></span>
  </div>
</header>

<div class="toolbar">
  <div class="cat-bar" id="catBar">
    <button class="cat-btn active" data-cat="all">🖼 全部</button>
    <button class="cat-btn top5" data-cat="__top5__">🏆 Top 5</button>
  </div>
  <div class="sort-bar" id="sortBar">
    <label>排序</label>
    <button class="sort-btn active" data-sort="votes">最多票</button>
    <button class="sort-btn" data-sort="likes">最多讚</button>
    <button class="sort-btn" data-sort="score">最高分</button>
    <button class="sort-btn" data-sort="default">預設</button>
  </div>
</div>

<div id="gallery" class="gallery">
  <div class="loading-gallery"><div class="spinner"></div></div>
</div>

<div class="empty-state" id="emptyState" style="display:none;">
  <div class="big-icon">🏝️</div>
  <p>這個分類還沒有作品</p>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lbImg" src="" alt="">
  <div class="lightbox-info">
    <div class="title" id="lbTitle"></div>
    <div class="cat" id="lbCat"></div>
    <div class="vote-row" id="lbVoteRow"></div>
  </div>
</div>

<!-- Admin Modal -->
<div class="modal-overlay" id="adminModal">
  <div class="modal">
    <h3>🔑 管理員驗證</h3>
    <p style="color:var(--text2);font-size:.75rem;margin:8px 0 14px;">輸入密碼以刪除作品</p>
    <input type="password" id="pwdInput" placeholder="請輸入管理密碼" autocomplete="off">
    <div class="error" id="pwdError">密碼錯誤</div>
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeAdminModal()">取消</button>
      <button class="btn-confirm" id="pwdConfirm">確認刪除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<footer>
  Inspired by the Maldives ocean &middot; Moodhu Designs
</footer>

<script>
// ════ 設定
const API_BASE = (() => {
  const loc = window.location;
  if (loc.hostname === 'localhost' || loc.hostname === '127.0.0.1')
    return `http://${loc.hostname}:8000`;
  return loc.origin;
})();
const ADMIN_PASSWORD = 'moodhu2024';

// ════ 投票者識別
function getVoterId() {
  let vid = localStorage.getItem('moodhu_voter_id');
  if (!vid) {
    const fp = [
      navigator.userAgent, screen.width, screen.height, screen.colorDepth,
      navigator.language, Intl.DateTimeFormat().resolvedOptions().timeZone
    ].join('||');
    let hash = 0;
    for (let i = 0; i < fp.length; i++) { hash = ((hash << 5) - hash) + fp.charCodeAt(i); hash |= 0; }
    vid = 'v_' + Math.abs(hash).toString(36) + '_' + Date.now().toString(36);
    localStorage.setItem('moodhu_voter_id', vid);
  }
  return vid;
}
const VOTER_ID = getVoterId();

// ════ 全域
let designs = [];
let userVotes = {};
let currentCat = 'all';
let currentSort = 'votes';
let deleteTarget = null;

// ════ API
async function apiGet(path) {
  const r = await fetch(`${API_BASE}${path}`);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function apiPost(path, body) {
  const r = await fetch(`${API_BASE}${path}`, {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// ════ Toast
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + type;
  t.classList.add('show');
  clearTimeout(t._hide);
  t._hide = setTimeout(() => t.classList.remove('show'), 2500);
}

// ════ 管理員 Modal
function openAdminModal(designId) {
  deleteTarget = designId;
  document.getElementById('pwdInput').value = '';
  document.getElementById('pwdError').style.display = 'none';
  document.getElementById('adminModal').classList.add('show');
  setTimeout(() => document.getElementById('pwdInput').focus(), 100);
}
function closeAdminModal() {
  document.getElementById('adminModal').classList.remove('show');
  deleteTarget = null;
}
document.getElementById('pwdConfirm').onclick = async function() {
  const pwd = document.getElementById('pwdInput').value;
  if (pwd === ADMIN_PASSWORD) {
    const target = deleteTarget;
    closeAdminModal();
    if (target) doDelete(target);
    showToast('✅ 管理員驗證成功', 'success');
  } else {
    document.getElementById('pwdError').style.display = 'block';
  }
};
document.getElementById('pwdInput').onkeydown = e => {
  if (e.key === 'Enter') document.getElementById('pwdConfirm').click();
};
document.getElementById('adminModal').onclick = function(e) {
  if (e.target === this) closeAdminModal();
};

// ════ Lightbox
let lbDesignId = null;
function openLightbox(designId) {
  lbDesignId = designId;
  const d = designs.find(x => x.id === designId);
  if (!d) return;
  document.getElementById('lbImg').src = `images/${d.filename}`;
  document.getElementById('lbTitle').textContent = d.title;
  document.getElementById('lbCat').textContent = d.category;

  const vb = document.getElementById('lbVoteRow');
  const vc = window._lastVoteCounts?.[designId] || { likes: 0, dislikes: 0 };
  const my = userVotes[designId];
  vb.innerHTML = `
    <button class="vote-btn like ${my === 'like' ? 'active' : ''}" onclick="castVote('${designId}','like');event.stopPropagation()">
      <span class="icon">👍</span> <span class="count">${vc.likes}</span>
    </button>
    <button class="vote-btn dislike ${my === 'dislike' ? 'active' : ''}" onclick="castVote('${designId}','dislike');event.stopPropagation()">
      <span class="icon">👎</span> <span class="count">${vc.dislikes}</span>
    </button>`;

  document.getElementById('lightbox').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeLightbox(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('lightbox').classList.remove('show');
  document.body.style.overflow = '';
  lbDesignId = null;
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();
});

// ════ 核心功能
async function castVote(designId, voteType) {
  const btn = event?.currentTarget;
  if (btn) btn.classList.add('loading');
  try {
    const result = await apiPost(`/api/vote?voter_id=${encodeURIComponent(VOTER_ID)}`, {
      design_id: designId, vote_type: voteType
    });
    userVotes = result.my || {};
    await renderGallery();
    await updateStats();
    if (lbDesignId === designId) {
      const vc = (result.votes || {})[designId] || { likes: 0, dislikes: 0 };
      const my = userVotes[designId];
      const vb = document.getElementById('lbVoteRow');
      vb.innerHTML = `
        <button class="vote-btn like ${my === 'like' ? 'active' : ''}" onclick="castVote('${designId}','like');event.stopPropagation()">
          <span class="icon">👍</span> <span class="count">${vc.likes}</span>
        </button>
        <button class="vote-btn dislike ${my === 'dislike' ? 'active' : ''}" onclick="castVote('${designId}','dislike');event.stopPropagation()">
          <span class="icon">👎</span> <span class="count">${vc.dislikes}</span>
        </button>`;
    }
    const msg = result.action === 'removed' ? '✅ 已取消投票' : '✅ 投票成功！';
    showToast(msg, 'success');
  } catch(e) {
    showToast('⚠️ 投票失敗', 'error');
  } finally {
    if (btn) btn.classList.remove('loading');
  }
}

async function doDelete(designId) {
  try {
    await apiPost('/api/delete', { design_id: designId, password: ADMIN_PASSWORD });
    const data = await apiGet('/api/designs');
    designs = data.designs || [];
    showToast('🗑️ 已刪除作品', 'success');
    await renderGallery();
    await updateStats();
  } catch(e) {
    showToast('⚠️ 刪除失敗: ' + e.message, 'error');
  }
}

async function renderGallery() {
  const container = document.getElementById('gallery');
  const empty = document.getElementById('emptyState');

  let voteCounts = {}, myVotes = {};
  try {
    [voteCounts, myVotes] = await Promise.all([
      apiGet('/api/votes'),
      apiGet(`/api/votes/me?voter_id=${encodeURIComponent(VOTER_ID)}`)
    ]);
  } catch(e) {}
  userVotes = myVotes;
  window._lastVoteCounts = voteCounts;

  let filtered = [...designs];
  if (currentCat === '__top5__') {
    filtered.sort((a, b) => {
      const sa = (voteCounts[a.id]?.likes || 0) - (voteCounts[a.id]?.dislikes || 0);
      const sb = (voteCounts[b.id]?.likes || 0) - (voteCounts[b.id]?.dislikes || 0);
      return sb - sa;
    });
    filtered = filtered.slice(0, 5);
  } else if (currentCat !== 'all') {
    filtered = designs.filter(d => d.category === currentCat);
  }

  // 排序
  filtered.sort((a, b) => {
    const va = voteCounts[a.id] || { likes: 0, dislikes: 0 };
    const vb = voteCounts[b.id] || { likes: 0, dislikes: 0 };
    const ta = va.likes + va.dislikes;
    const tb = vb.likes + vb.dislikes;
    const sa = va.likes - va.dislikes;
    const sb = vb.likes - vb.dislikes;
    if (currentSort === 'likes') return (vb.likes || 0) - (va.likes || 0);
    if (currentSort === 'score') return sb - sa;
    if (currentSort === 'votes') return tb - ta;
    return 0; // default
  });

  if (filtered.length === 0) {
    container.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  let html = '';
  filtered.forEach((d, i) => {
    const vc = voteCounts[d.id] || { likes: 0, dislikes: 0 };
    const my = myVotes[d.id];
    const isTop5 = currentCat === '__top5__';
    const rank = i + 1;
    const topClass = !isTop5 && rank <= 4 ? ` top${rank}` : '';
    const rankLabel = rank <= 3 ? ['🥇','🥈','🥉'][rank-1] : '';

    html += `
      <div class="card${topClass}" data-id="${d.id}">
        <div class="card-img-wrap" onclick="openLightbox('${d.id}')">
          <img class="loading" loading="lazy" src="images/${d.filename}"
               alt="${d.title}" onload="this.classList.remove('loading');this.classList.add('loaded')"
               onerror="this.parentElement.innerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;height:100%;color:#979a9b;font-size:2rem\\'>❌</div>'">
        </div>
        <div class="card-body">
          <div class="card-cat">${d.category}</div>
          <div class="card-title" title="${d.title}">${rankLabel ? '<span class="card-rank t' + rank + '">' + rankLabel + '</span> ' : ''}${d.title}</div>
          <div class="vote-row">
            <button class="vote-btn like ${my === 'like' ? 'active' : ''}" onclick="event.stopPropagation();castVote('${d.id}','like')">
              <span class="icon">👍</span> <span class="count">${vc.likes || 0}</span>
            </button>
            <button class="vote-btn dislike ${my === 'dislike' ? 'active' : ''}" onclick="event.stopPropagation();castVote('${d.id}','dislike')">
              <span class="icon">👎</span> <span class="count">${vc.dislikes || 0}</span>
            </button>
            <button class="del-btn" onclick="event.stopPropagation();openAdminModal('${d.id}')" title="刪除">🗑️</button>
          </div>
        </div>
      </div>`;
  });

  container.innerHTML = html;
}

async function updateStats() {
  try {
    const stats = await apiGet('/api/stats');
    document.getElementById('totalVotes').textContent = stats.total_votes || 0;
    document.getElementById('voterCount').textContent = stats.voter_count || 0;
    document.getElementById('topDesign').textContent = stats.top_design || '-';
  } catch(e) {}
}

function buildCats() {
  const cats = [...new Set(designs.map(d => d.category))].sort();
  const bar = document.getElementById('catBar');
  cats.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn'; btn.dataset.cat = c;
    btn.textContent = c; bar.appendChild(btn);
  });
}

// ════ 事件繫結
document.getElementById('catBar').addEventListener('click', e => {
  const btn = e.target.closest('.cat-btn');
  if (!btn) return;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentCat = btn.dataset.cat;
  renderGallery();
});

document.getElementById('sortBar').addEventListener('click', e => {
  const btn = e.target.closest('.sort-btn');
  if (!btn) return;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentSort = btn.dataset.sort;
  renderGallery();
});

// ════ 啟動
async function init() {
  try {
    let data;
    try {
      data = await apiGet('/api/designs');
      designs = data.designs || [];
    } catch(e) {
      const resp = await fetch('designs.json');
      const j = await resp.json();
      designs = j.designs;
    }
    buildCats();
    await renderGallery();
    await updateStats();

    setInterval(updateStats, 30000);
  } catch(e) {
    document.getElementById('gallery').innerHTML = `
      <div class="empty-state">
        <div class="big-icon">⚠️</div>
        <p>載入失敗：${e.message}</p>
        <p style="font-size:.75rem;color:var(--text2);margin-top:8px;">請確認後端伺服器是否正常運行</p>
      </div>`;
  }
}

init();
</script>
</body>
</html>
